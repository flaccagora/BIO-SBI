[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bio-sbi"
version = "0.2.0"
description = "Modular simulation-based inference for two-type cell branching processes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "numba>=0.61",
  "torch>=2.5",
  "sbi==0.27.0",
  "hydra-core>=1.3.2",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[project.scripts]
bio-sbi = "bio_sbi.cli:main"
bio-sbi-infer = "bio_sbi.cli:infer_main"
bio-sbi-collect = "bio_sbi.collect:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --disable-plugin-autoload"
markers = ["slow: trains neural networks end to end"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "D"]
ignore = ["D105", "D107", "D203", "D213", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.hatch.build.targets.wheel]
packages = ["src/bio_sbi"]
