# @package _global_
# E2 follow-up: asymmetric A<->B mis-typing, ignored vs known. e_A = P(A labelled B),
# e_B = P(B labelled A). Ignored arm (inference assumes perfect typing):
#   bio-sbi -m +experiment=e2_asymmetric hydra.sweep.dir=results/e2_asym/ignored
# Known arm (the same confusion is modelled by inference):
#   bio-sbi -m +experiment=e2_asymmetric observation=noisy observation.capture=1.0 \
#     'observation.confusion=${data.observation.confusion}' hydra.sweep.dir=results/e2_asym/known
# 4 settings x 2 simulators x 5 seeds = 40 runs per arm.
defaults:
  - override /law: reversible_ab
  - override /design: real_like
  - override /budget: dev
  - override /observation@data.observation: noisy
data:
  observation:
    capture: 1.0
    confusion: {A: {A: 0.9, B: 0.1}, B: {A: 0.0, B: 1.0}}
info:
  title: "E2 follow-up: asymmetric A<->B mis-typing"
  question: |
    Is mis-typing in one direction (A read as B, or B read as A) more harmful than the
    other, when ignored and when known? Settings (e_A, e_B): (0.1, 0), (0, 0.1),
    (0.05, 0.15), (0.15, 0.05).
  notes: |
    Compare with the symmetric E2a/E2b (results/e2/) at e = 0.1.
hydra:
  sweeper:
    params:
      simulator: galton_watson,bellman_harris
      data.observation.confusion: "{A:{A:0.9,B:0.1},B:{A:0.0,B:1.0}},\
        {A:{A:1.0,B:0.0},B:{A:0.1,B:0.9}},\
        {A:{A:0.95,B:0.05},B:{A:0.15,B:0.85}},\
        {A:{A:0.85,B:0.15},B:{A:0.05,B:0.95}}"
      seed: 0,1,2,3,4
