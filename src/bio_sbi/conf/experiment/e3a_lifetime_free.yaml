# @package _global_
# E3a arm (i): per-type division times in the data (A 20 h, B in {20, 30, 45} h), both
# mean lifetimes inferred (Bellman-Harris baseline). Arms (ii)/(iii), lifetimes fixed
# to a pooled or wrong value, are in e3a_lifetime_fixed.
#   bio-sbi -m +experiment=e3a_lifetime_free hydra.sweep.dir=results/e3a/free
# 3 B lifetimes x 5 seeds = 15 runs.
defaults:
  - override /simulator: bellman_harris
  - override /law: reversible_ab
  - override /design: real_like
  - override /budget: dev
info:
  title: "E3a: per-type division time, lifetimes inferred"
  question: |
    With A.mean_lifetime = 20 h and B.mean_lifetime in {20, 30, 45} h in the data, are
    the outcome probabilities and both lifetimes recovered when the lifetimes are
    inferred? Reference arm for e3a_lifetime_fixed.
hydra:
  sweeper:
    params:
      data.simulator.reference.B.mean_lifetime: 20,30,45
      seed: 0,1,2,3,4
