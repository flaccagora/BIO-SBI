# @package _global_
# E4: how many organoids, and which days, reach a target accuracy per parameter?
# Galton-Watson (horizons in generations ~ days):
#   bio-sbi -m +experiment=e4_design hydra.sweep.dir=results/e4/gw
# Bellman-Harris (horizons in hours):
#   bio-sbi -m +experiment=e4_design simulator=bellman_harris \
#       'design.horizons=[240],[144,240],[96,144,240],[144,240,336]' \
#       hydra.sweep.dir=results/e4/bh
# Two-type law at large designs (is B.to_A recoverable at 256-512 clones?):
#   bio-sbi -m +experiment=e4_design law=two_type design.clones=256,512 \
#       hydra.sweep.dir=results/e4/gw_two_type
# 6 clone counts x 4 horizon sets x 5 seeds = 120 runs per simulator.
defaults:
  - override /law: reversible_ab
  - override /design: real_like
  - override /budget: dev
design:
  clones: 32       # one count for every horizon (swept below)
info:
  title: "E4: amount of data (design benchmark)"
  question: |
    For each parameter, how do contraction and error depend on the number of
    organoids per day (16 ... 512) and on the measured days ({10}, {6, 10},
    {4, 6, 10}, {6, 10, 14})? Deliverable: the minimum organoids per day to reach
    contraction > 0.5 and |error| < 0.05.
  notes: |
    design.clones is per horizon. Repeat at the realistic error level from E2 with
    e.g. 'observation=noisy observation.capture=1.0 observation.confusion=0.05'.
hydra:
  sweeper:
    params:
      design.clones: 16,32,64,128,256,512
      design.horizons: "[10],[6,10],[4,6,10],[6,10,14]"
      seed: 0,1,2,3,4
