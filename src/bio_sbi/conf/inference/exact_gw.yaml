# Exact-likelihood Bayesian inference for the two-type Galton-Watson model: NUTS on the
# exact law of the raw endpoint counts (2-D FFT of the iterated pgf), same theta
# coordinates and prior as NPE. No training: budget.simulations / max_epochs are unused.
# Supports simulator=galton_watson(_hours), two types (two_type, reversible_ab, any fixed
# entries), fixed founder rows, homogeneous law, two labels (any capture / 2x2 confusion),
# selection detected or all; anything else raises ValueError.
#   bio-sbi inference=exact_gw law=reversible_ab design=real_like
name: exact_gw
# SBC cases for this method (one full MCMC run each, ~1-5 min): overrides
# budget.sbc_cases. null = use budget.sbc_cases; 0 = skip SBC.
sbc_cases: 20
method:
  _target_: bio_sbi.inference.ExactGW
  chains: 4                    # independent NUTS chains (initialised at the best of init_starts optima)
  warmup: 300                  # adaptation iterations per chain (step size + dense mass matrix)
  draws: 500                   # kept iterations per chain (posterior_samples are drawn from these)
  max_tree_depth: 8
  target_accept: 0.8
  dense_mass: true
  threads: 4                   # chains / optimisations in parallel threads (1 core each)
  init_starts: 8               # prior draws optimised by L-BFGS to initialise the chains
  init_maxiter: 200
  init_tolerance: 20           # chains start only at optima within 20 nats of the best
  log_every: 50                # chain progress in the log every N iterations (0 = silent)
  floor: 1.0e-15               # probability floor of the likelihood
  min_detection: 1.0e-6        # floor of P(detected) in the conditioning (see gw_exact.log_likelihood)
  grid:                        # FFT grid per horizon, from the dataset's largest counts
    factor: 1.25               # L = next_fast_len(max(min_size, factor * max_count + margin))
    margin: 16
    min_size: 32
    damping: 1.0e+4            # evaluation radius: round-off amplification <= damping; aliasing <~3e-3
    max_points: 4.0e+6         # Lx * Ly cap per horizon (memory) for the reference data
  optimise:                    # point estimate (gw_optimise.py) -> optimisation.json, never draws;
    enabled: false             #   true: also run after NUTS (or scripts/exact_gw_optimise.py alone)
    objective: mle             # mle | map (Dirichlet log prior on the normalised free probabilities)
    method: pso                # pso (+ L-BFGS-B refinement of refine_top) | multistart (L-BFGS-B) | sgd
    boundary_eps: 0.0          # stick box [eps, 1-eps]; map with any alpha < 1 needs eps > 0
    init: prior                # prior | uniform starting particles / starts
    restarts: 2                # independent swarms (seeded from seed)
    swarm: 24
    max_iter: 100
    max_evals: null            # per swarm (objective-only evaluations); null = swarm*(max_iter+1)
    inertia: 0.7298            # constriction coefficients (Clerc-Kennedy)
    inertia_end: null          # linear inertia schedule (null = constant)
    cognitive: 1.49618
    social: 1.49618
    velocity_max: 0.25         # fraction of the box width per coordinate
    boundary: reflect          # reflect (mirror + reverse velocity) | clamp (absorbing)
    patience: 20               # stop if the best improved < tol nats over patience iterations
    tol: 1.0e-4
    xtol: 1.0e-6               # ... or the swarm collapsed
    refine_top: 4              # distinct PSO candidates refined (0 = PSO alone)
    refine_maxiter: 500
    starts: 8                  # method=multistart / sgd (same prior draws for both)
    dedup_tol: 1.0e-2          # max |dp| below which candidates are duplicates
    sgd_optimizer: adam        # method=sgd: adam | momentum (heavy ball); gradient / total clones
    sgd_coords: box            # box (projected, sticks; reaches boundary faces) | logit (clipped)
    sgd_lr: 0.02               # step size in sgd_coords
    sgd_schedule: cosine       # constant | cosine | exp (to sgd_lr * sgd_lr_final)
    sgd_lr_final: 0.01
    sgd_momentum: 0.9          # momentum / Adam beta1
    sgd_beta2: 0.999
    sgd_iter: 500              # steps per start
    sgd_max_evals: null        # gradient evaluations per start (null = sgd_iter)
    sgd_batch: null            # null = full batch; fraction of clones per horizon (minibatch)
    sgd_eval_every: 10         # minibatch: full objective-only check every N steps
    sgd_patience: 100          # stop if the best improved < sgd_tol nats over this many steps
    sgd_tol: 1.0e-3
    sgd_logit_bound: 15.0      # sgd_coords=logit: |logit(theta)| <= bound
    sgd_polish: true           # L-BFGS-B on the refine_top best distinct SGD endpoints
    workers: null              # threads for evaluations (null = threads)
    log_every: 10
    validate: true             # larger grids, floors, eps, constraints (validation section)
    near_tol: 1.0e-6
    validation_grids: [2, 4]
    validation_max_points: 4.0e+6
  sbc:                         # MCMC settings of each SBC case (cheaper than the reference fit;
    chains: 2                  #   threads // chains cases run at a time)
    warmup: 100
    draws: 100
    init_starts: 2
    max_tree_depth: 6          # bounds the cost of hard posteriors (some prior draws need depth 8)
    max_points: 2.5e+5         # skip SBC datasets needing a larger grid (cost; ranks stay uniform)
