# Ideal assay: every endpoint cell detected and labelled with its own type; only clones
# with at least one detected cell are recorded.
_target_: bio_sbi.observation.ObservationModel
labels: null                   # measured labels; null = the simulator's types
capture: null                  # null = 1 for every type
confusion: null                # null = identity by name
selection: detected
exact_detection: true          # exact conditional sampler when the simulator has one
max_attempts_per_clone: 1000
