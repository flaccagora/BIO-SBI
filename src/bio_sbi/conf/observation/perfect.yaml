# Ideal assay: every endpoint cell detected and correctly typed; only clones with
# at least one detected cell are recorded.
_target_: bio_sbi.observation.ObservationModel
capture: [1.0, 1.0]
confusion: [[1.0, 0.0], [0.0, 1.0]]
selection: detected
exact_detection: true          # exact conditional sampler when the simulator has one
max_attempts_per_clone: 1000
