# Root config. Every group below can be swapped from the command line, e.g.
#   bio-sbi simulator=bellman_harris inference=nle observation=noisy budget=smoke
#
# `simulator`, `law` and `observation` define the INFERENCE model. The reference
# ("observed") data come from `data.*`, which mirror the inference choices unless
# overridden to study model misspecification, e.g.
#   bio-sbi law@data.law=three_type observation@data.observation=three_as_two
defaults:
  - simulator: galton_watson   # generative model: galton_watson | bellman_harris
  - law: two_type              # types, transitions, founders, fixed values, prior
  - observation: perfect       # measurement model: perfect | noisy | all_clones
  - summary: moments           # summary statistic: moments | means
  - inference: npe             # sbi method: npe | nle | nre
  - budget: dev                # compute budget: smoke | dev | full
  - design: default            # endpoints x clones: default | real_like | single_128 | three_128 | single_384
  - simulator@data.simulator: ${simulator}       # data-generating model (default: same)
  - law@data.law: ${law}
  - observation@data.observation: ${observation}
  - _self_

seed: 0              # root seed; every stochastic stage derives a keyed stream from it
data_seed: ${seed}   # root seed of the DATA side only: truth draw (truth.source=prior)
                     # and reference dataset. `seed` keeps seeding training simulations,
                     # network training, posterior sampling, PPC and SBC.
device: cpu          # torch device for training (cpu | cuda)
workers: 4           # threads for simulating independent datasets
torch_threads: 4     # torch intra-op threads (0 = torch default)
save_training_data: false   # store theta/x of all simulations in training_data.npz

# Generating parameters of the reference ("pseudo-observed") dataset (data model).
truth:
  source: reference  # reference: data.law.reference + data.simulator.reference (+ values)
                     # prior: one draw from the data model's prior
  values: null       # nested overrides, e.g. 'truth.values={A: {death: 0.1, div_AA: 0.48}}'
  max_draws: 50      # truth.source=prior: redraw unusable truths (no detectable clone /
                     # above simulation limits) up to this many times, reproducibly

# Description of a multirun, written to <sweep dir>/info.md (set by experiment presets).
info:
  title: null        # e.g. "Design comparison"
  question: null     # what the sweep tests
  notes: null

hydra:
  callbacks:
    experiment_info:
      _target_: bio_sbi.callbacks.ExperimentInfo
  job:
    chdir: false
  run:
    dir: outputs/${simulator.name}-${law.name}-${inference.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${short:${hydra.job.override_dirname}}   # long overrides -> prefix + hash
