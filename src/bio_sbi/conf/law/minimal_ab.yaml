# Former "discrete" model: A always divides or dies; B only persists or switches to A.
name: minimal_ab
types: [A, B]
outcomes: all
max_daughters: 2
founder_sizes: [1]
fixed:
  founder: {A: 1.0}
  A: {persist: 0.0, to_B: 0.0}
  B: {death: 0.0, div_AA: 0.0, div_AB: 0.0, div_BB: 0.0}
concentration: {}
reference:
  A: {div_AA: 0.45, div_AB: 0.25, div_BB: 0.15, death: 0.15}
  B: {persist: 0.7, to_A: 0.3}
