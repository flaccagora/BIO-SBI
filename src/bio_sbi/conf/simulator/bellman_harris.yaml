# Age-dependent Bellman-Harris process with Gamma lifetimes (bio_sbi.simulators.BellmanHarris).
# Each cell lives Gamma(shape, mean/shape) hours, then draws an outcome from the law.
# shape = 1 gives exponential (Markov) lifetimes; large shapes approach synchronous divisions.
name: bellman_harris
horizons: [80, 160, 240]       # default design endpoints (hours)
real_horizons: [144, 240]      # day 6 / day 10 of the real data (design=real_like)
reference:                     # truth for the lifetime parameters (one per law type)
  A: {mean_lifetime: 20.0}
  B: {mean_lifetime: 30.0}
  C: {mean_lifetime: 25.0}     # used only by laws that have a type C
model:
  _target_: bio_sbi.simulators.BellmanHarris
  law: ${...law}
  fixed: {}                    # e.g. {A: {mean_lifetime: 20.0}} to stop inferring it
  time_unit: hours
  lifetime_shape: 8.0          # Gamma shape, one value or {type: value}; CV = 1/sqrt(shape)
  lifetime_mean_bounds: [10.0, 80.0]   # log-uniform prior, one pair or {type: [low, high]}
  max_cells: 50000
  max_events: 5000000
